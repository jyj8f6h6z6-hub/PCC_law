<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程會電子法規彙編</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap"><h1>工程會電子法規彙編</h1><p>政府採購法・施行細則・工程會10類主管法規145筆・工程會PRMS 3,666筆函釋</p></div></header>
<nav class="tabs wrap"><button class="tab active" data-view="search">🔎 全站搜尋</button><button class="tab" data-view="articles">📖 採購法逐條</button><button class="tab" data-view="laws">📚 工程會主管法規</button><button class="tab" data-view="letters">📩 工程會函釋</button></nav>
<main class="wrap">
<section id="searchView" class="view"><div class="panel searchbox"><h2>全站搜尋</h2><input id="q" type="search" placeholder="搜尋法規、法條、函釋主旨、全文，例如：第58條、最有利標、押標金"><div class="controls"><label>範圍 <select id="scope"><option value="all">全部</option><option value="laws">工程會主管法規</option><option value="letters">工程會函釋</option></select></label><label><input id="full" type="checkbox" checked> 函釋顯示全文</label><button id="clear">清除</button></div></div><div id="searchStatus"></div><div id="lawHits"></div><div id="letterHits"></div><button id="more" hidden>顯示更多函釋</button></section>
<section id="articlesView" class="view" hidden><div class="panel articlebar"><div><h2>採購法逐條</h2><p>可切換政府採購法與施行細則；右側顯示完整條文、引用本條的主管法規及相關函釋。</p></div><select id="articleLaw"><option>政府採購法</option><option>政府採購法施行細則</option></select></div><div class="article-layout"><div id="articleList" class="panel article-list"></div><aside id="articleDetail" class="panel article-detail"><div class="empty">請選擇條文</div></aside></div></section>
<section id="lawsView" class="view" hidden><div class="panel"><div class="section-head"><div><h2>工程會主管法規 <span class="muted">145筆</span></h2><p>資料依工程會10類主管法規JSON建立；點法規名稱直接閱讀完整內容。</p></div></div><div class="controls"><input id="lawq" type="search" placeholder="搜尋法規名稱或全文"><select id="category"><option value="">全部10類</option></select></div><div id="lawsCount"></div><div id="lawsList"></div></div></section>
<section id="lawDetailView" class="view" hidden><button id="backLaws" class="back">← 返回主管法規</button><article id="lawDetail" class="panel"></article></section>
<section id="lettersView" class="view" hidden><div class="panel searchbox"><h2>工程會PRMS 3,666筆函釋</h2><input id="lq" type="search" placeholder="搜尋法規依據、主旨、全文、發文字號、PRMS ID"><div class="controls"><label>範圍 <select id="lscope"><option value="all">全部</option><option value="basis">法規依據</option><option value="subject">主旨</option><option value="body">全文</option></select></label><label>排序 <select id="lsort"><option value="new">最新優先</option><option value="old">最舊優先</option></select></label><label><input id="lfull" type="checkbox" checked> 顯示全文</label><button id="lclear">清除</button></div></div><div id="lstatus"></div><div id="lresults"></div><button id="lmore" hidden>顯示更多</button></section>
</main><div id="drawer" class="drawer" hidden><div class="drawer-head"><b id="drawerTitle"></b><button id="drawerClose">×</button></div><div id="drawerBody"></div></div><footer class="wrap">法規資料：工程會主管法規下載資料；函釋資料：工程會PRMS。正式適用仍以主管機關公布之現行內容為準。</footer><script src="app.js"></script></body></html>
